<title>AI, Under the Hood</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script type="application/json" id="claude-artifacts-manifest">{"permissions": []}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a calm reading column beside a sticky lesson list; every model call lands in a dark "lightbox" x-ray panel. */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --surface-2: #e3e9ed;
  --ink: #12202b;
  --muted: #526271;
  --line: #cbd5dc;
  --accent: #0b6f86;
  --accent-ink: #ffffff;
  --accent-soft: #d3eaf0;
  --you: #2f5bd3;
  --model: #0a7d61;
  --good: #1d7547;
  --good-soft: #dcefe3;
  --bad: #b3261e;
  --bad-soft: #f8e1df;
  --warn: #8a5200;
  --t0: #d6e6fb;
  --t1: #d5efe6;
  --t2: #f6e7c8;
  --t3: #ecdcf3;
  --film: #0b1820;
  --film-2: #112430;
  --film-ink: #d4e9f0;
  --film-muted: #87a3b1;
  --film-line: #23394a;
  --sent: #8cb4ff;
  --recv: #6fe0c2;
  --tool: #f2c46d;
  --err: #ff8f87;
  --note: #b8c7d0;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: 2.125rem;
  --step-4: clamp(2.25rem, 1.6rem + 2.6vw, 3.5rem);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1419;
    --surface: #121d25;
    --surface-2: #192832;
    --ink: #e2ebf0;
    --muted: #94a8b5;
    --line: #273843;
    --accent: #5cc4da;
    --accent-ink: #06222a;
    --accent-soft: #123441;
    --you: #8cb4ff;
    --model: #6fe0c2;
    --good: #6fd39a;
    --good-soft: #143325;
    --bad: #ff8f87;
    --bad-soft: #3a1a18;
    --warn: #f2c46d;
    --t0: #1d3354;
    --t1: #16392f;
    --t2: #3e3218;
    --t3: #36254a;
    --film: #071016;
    --film-2: #0d1b24;
    --film-line: #1c3140;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1419;
  --surface: #121d25;
  --surface-2: #192832;
  --ink: #e2ebf0;
  --muted: #94a8b5;
  --line: #273843;
  --accent: #5cc4da;
  --accent-ink: #06222a;
  --accent-soft: #123441;
  --you: #8cb4ff;
  --model: #6fe0c2;
  --good: #6fd39a;
  --good-soft: #143325;
  --bad: #ff8f87;
  --bad-soft: #3a1a18;
  --warn: #f2c46d;
  --t0: #1d3354;
  --t1: #16392f;
  --t2: #3e3218;
  --t3: #36254a;
  --film: #071016;
  --film-2: #0d1b24;
  --film-line: #1c3140;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
}
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
code, pre, kbd { font-family: var(--font-mono); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { max-width: 1160px; margin: 0 auto; }
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar-inner { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--ink); text-decoration: none; }
.brand-mark { display: inline-grid; grid-template-columns: repeat(3, 8px); gap: 2px; }
.brand-mark i { display: block; height: 8px; border-radius: 2px; background: var(--accent); }
.brand-mark i:nth-child(n+4) { background: var(--model); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { font-size: var(--step--1); font-variant-numeric: tabular-nums; padding: 2px 10px; border-radius: 99px; background: var(--surface-2); color: var(--ink); }
.save-state { font-size: var(--step--1); color: var(--muted); }
.save-state[data-mode="error"], .save-state[data-mode="readonly"] { color: var(--warn); }

main { padding-block: 32px 64px; }
.eyebrow { font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }

.btn {
  font: inherit;
  font-weight: 600;
  font-size: 0.9375rem;
  border-radius: 8px;
  padding: 8px 16px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-quiet { background: transparent; }
.btn-small { min-height: 32px; padding: 4px 10px; font-size: var(--step--1); }

/* Home */
.intro { max-width: 760px; padding-block: 16px 24px; }
.intro h1 { font-size: var(--step-4); font-weight: 700; letter-spacing: -0.025em; }
.lede { font-size: var(--step-1); color: var(--muted); max-width: 62ch; margin: 16px 0 24px; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px 24px; margin: 0 0 28px; }
.how div { border-top: 2px solid var(--ink); padding-top: 10px; }
.how dt { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); }
.how dd { margin: 4px 0 0; color: var(--muted); font-size: 0.9375rem; }
.home-progress { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.bar { flex: 1 1 160px; max-width: 260px; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar-fill { display: block; height: 100%; width: 0; background: var(--model); border-radius: 99px; transition: width 300ms ease; }
.home-progress-text { margin: 0; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9375rem; }
.section-title { font-size: var(--step-2); margin: 40px 0 16px; }
.lesson-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lesson-row { border-bottom: 1px solid var(--line); }
.lesson-link { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 16px 8px; color: var(--ink); text-decoration: none; border-radius: 8px; }
.lesson-link:hover { background: var(--surface); }
.lesson-num { font-family: var(--font-display); font-size: var(--step-3); font-weight: 700; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.lesson-text { display: grid; gap: 2px; min-width: 0; }
.lesson-name { font-family: var(--font-display); font-weight: 700; font-size: var(--step-1); }
.lesson-blurb { color: var(--muted); font-size: 0.9375rem; }
.lesson-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.lesson-min { font-size: var(--step--1); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.chip-started { background: var(--accent-soft); color: var(--accent); }
.chip-done { background: var(--good-soft); color: var(--good); }
.home-notes ul { margin: 0; padding-left: 1.2em; max-width: 68ch; color: var(--muted); display: grid; gap: 6px; }

/* Lesson */
.lesson-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
.side { display: none; }
@media (min-width: 1000px) {
  .lesson-layout { grid-template-columns: 220px minmax(0, 1fr); gap: 48px; }
  .side { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); align-self: start; max-height: calc(100vh - 96px); overflow: auto; }
  .lesson-back { display: none; }
}
.side-home { display: inline-block; font-size: var(--step--1); font-weight: 600; margin-bottom: 10px; }
.side-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.side-link { display: grid; grid-template-columns: 1.6rem 1fr; gap: 6px; padding: 6px 8px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 0.9rem; line-height: 1.35; }
.side-link:hover { background: var(--surface); color: var(--ink); }
.side-link[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.side-n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.side-link.status-done .side-n { color: var(--good); }
.lesson { min-width: 0; max-width: 820px; }
.lesson-back { display: inline-block; font-size: var(--step--1); font-weight: 600; margin-bottom: 12px; }
.lesson-head h1 { font-size: var(--step-4); font-weight: 700; letter-spacing: -0.025em; }
.lesson-head h1:focus { outline: none; }
.lesson-sub { font-size: var(--step-1); color: var(--muted); margin: 10px 0 6px; max-width: 60ch; }
.lesson-facts { font-size: var(--step--1); color: var(--muted); margin: 0 0 28px; }
.lesson-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.lesson-body > *, .pg-body > *, .pg-part > *, .eng-body > * { min-width: 0; }

.prose { max-width: 66ch; }
.prose > :first-child { margin-top: 0; }
.prose h2 { font-size: var(--step-2); margin: 28px 0 8px; }
.prose p, .prose ul, .prose ol { margin: 0 0 14px; }
.prose ul, .prose ol { padding-left: 1.2em; }
.prose li + li { margin-top: 6px; }
.prose dfn { font-style: normal; font-weight: 600; background: linear-gradient(transparent 62%, var(--accent-soft) 62%); }
.prose code, .eng code, .quiz code { font-size: 0.875em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

.diagram { min-width: 0; margin: 0; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.diagram-art { overflow-x: auto; }
.diagram svg { display: block; width: 100%; min-width: 520px; height: auto; }
.diagram figcaption { font-size: var(--step--1); color: var(--muted); margin-top: 8px; }
.d-box rect { fill: var(--surface-2); stroke: var(--line); }
.d-accent-box rect { fill: var(--accent); }
.d-text { fill: var(--ink); font: 500 15px var(--font-body); }
.d-label-strong { fill: var(--accent-ink); font: 700 15px var(--font-display); }
.d-small text, text.d-small { fill: var(--muted); font: 500 13px var(--font-body); }
.d-arrow { stroke: var(--muted); stroke-width: 2; fill: none; }
.d-arrowhead { fill: var(--muted); }
.d-bars rect { fill: var(--model); opacity: 0.85; }
.d-you rect { fill: var(--t0); stroke: var(--you); }
.d-model rect { fill: var(--t1); stroke: var(--model); }
.d-tool rect { fill: var(--t2); stroke: var(--warn); }
.d-chip-text text { fill: var(--ink); font: 600 12px var(--font-body); }
.d-line { stroke: var(--muted); stroke-width: 2; fill: none; }

/* Playground */
.playground { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.pg-head { display: grid; gap: 4px; }
.pg-title { font-size: var(--step-2); display: flex; align-items: center; gap: 10px; }
.pg-title::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--model); }
.pg-intro { margin: 0; color: var(--muted); max-width: 66ch; }
.pg-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; min-width: 0; }
.pg-part { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; }
.pg-part + .pg-part { border-top: 1px dashed var(--line); padding-top: 20px; }
.pg-sub { font-size: var(--step-1); }
.pg-note { margin: 0; color: var(--muted); font-size: 0.9375rem; }
.live-note { margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--step--1); color: var(--muted); padding: 8px 12px; background: var(--surface-2); border-radius: 8px; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.live-note[data-state="ready"] .live-dot { background: var(--good); }
.live-note[data-state="off"] .live-dot, .live-note[data-state="cooling"] .live-dot { background: var(--warn); }
.field { display: grid; gap: 4px; min-width: 0; }
.field-label { font-weight: 600; font-size: 0.9375rem; }
.field-hint { margin: 0; font-size: var(--step--1); color: var(--muted); }
.input { width: 100%; font: inherit; font-size: 0.9375rem; line-height: 1.5; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; resize: vertical; }
.input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.input.mono { font-family: var(--font-mono); font-size: 0.8125rem; line-height: 1.55; tab-size: 2; white-space: pre; overflow-x: auto; }
select.input { resize: none; }
.run-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.run-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.run-status { font-size: 0.9rem; color: var(--muted); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9375rem; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
.fineprint { margin: 0; font-size: var(--step--1); color: var(--muted); max-width: 72ch; }
.source a { font-weight: 500; }

.token-strip { margin: 0; padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; font-family: var(--font-mono); font-size: 0.875rem; line-height: 2.1; word-break: break-word; }
.tok { padding: 3px 1px; border-radius: 3px; margin-right: 1px; }
.tok-0 { background: var(--t0); } .tok-1 { background: var(--t1); } .tok-2 { background: var(--t2); } .tok-3 { background: var(--t3); }
.stat-row { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; }
.stat-row dt { font-size: var(--step--1); color: var(--muted); }
.stat-row dd { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: var(--step-2); font-variant-numeric: tabular-nums; }
.meter { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter-fill { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter-label { margin: 0; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.compare-col { display: grid; gap: 8px; align-content: start; min-width: 0; }
.compare-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.compare-title { font-family: var(--font-display); font-weight: 700; font-size: 1rem; }
.answer { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 0.9375rem; min-width: 0; overflow-wrap: anywhere; }
.answer > :first-child { margin-top: 0; } .answer > :last-child { margin-bottom: 0; }
.answer p, .answer ul, .answer ol { margin: 0 0 8px; }
.answer ul, .answer ol { padding-left: 1.2em; }
.answer.is-empty { color: var(--muted); }
.answer-heading { font-weight: 700; }
.answer-error { color: var(--bad); }
.thinking { color: var(--muted); font-style: italic; }
@media (prefers-reduced-motion: no-preference) {
  .thinking { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips-label { font-size: var(--step--1); color: var(--muted); }
.chip-btn { font: inherit; font-size: var(--step--1); text-align: left; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; cursor: pointer; }
.chip-btn:hover { border-color: var(--accent); }
.chat-log { display: grid; gap: 10px; max-height: 420px; overflow-y: auto; padding: 4px; }
.chat-log:empty { display: none; }
.bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 0.9375rem; min-width: 0; overflow-wrap: anywhere; }
.bubble p { margin: 0 0 6px; } .bubble p:last-child { margin: 0; }
.bubble ul, .bubble ol { margin: 0 0 6px; padding-left: 1.2em; }
.bubble-user { justify-self: end; background: var(--t0); border-bottom-right-radius: 4px; }
.bubble-assistant { justify-self: start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.bubble-who { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.size-bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.size-bars:empty::before { content: "Send a message to see how much each turn carries."; color: var(--muted); font-size: 0.9rem; }
.size-bars li { display: grid; grid-template-columns: 4.2rem minmax(60px, 1fr) auto; gap: 10px; align-items: center; font-size: var(--step--1); font-variant-numeric: tabular-nums; }
.size-track { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.size-fill { display: block; height: 100%; background: var(--you); border-radius: 99px; }
.size-bars li.is-forgot .size-fill { background: var(--warn); }
.size-label, .size-value { color: var(--muted); }

/* X-ray: a dark lightbox in both themes, like film on a viewer. */
.xray { background: var(--film); color: var(--film-ink); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; background-image: repeating-linear-gradient(0deg, transparent 0 23px, rgba(140, 180, 255, 0.04) 23px 24px); }
.xray-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.xray-title { font-size: 1rem; letter-spacing: 0.12em; text-transform: uppercase; font-family: var(--font-mono); font-weight: 500; color: var(--recv); }
.xray-hint { margin: 2px 0 0; font-size: var(--step--1); color: var(--film-muted); }
.xray .btn { color: var(--film-ink); border-color: var(--film-line); }
.xray-empty { margin: 0; font-size: 0.875rem; color: var(--film-muted); font-family: var(--font-mono); }
.xray-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.xray-step { border: 1px solid var(--film-line); border-left: 3px solid var(--note); border-radius: 8px; background: var(--film-2); padding: 10px 12px; min-width: 0; }
.xray-request { border-left-color: var(--sent); }
.xray-response { border-left-color: var(--recv); }
.xray-tool { border-left-color: var(--tool); }
.xray-error { border-left-color: var(--err); }
.xray-line { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 10px; align-items: baseline; }
.xray-n { font-family: var(--font-mono); font-size: 0.75rem; color: var(--film-muted); font-variant-numeric: tabular-nums; }
